name: Fetch Data & Rebuild

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch:
    name: Fetch all data sources
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch vehicle performance data
        run: python scrapers/fetch_vehicles.py
        env:
          BROUGHY_SHEET_ID: ${{ secrets.BROUGHY_SHEET_ID }}

      - name: Fetch Steam player data
        run: python scrapers/fetch_steam.py

      - name: Fetch Google Trends data
        run: python scrapers/fetch_trends.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: nightly refresh [skip ci]"
          file_pattern: "data/**/*.json"
          commit_user_name: "gta-intelligence-bot"
          commit_user_email: "bot@gta-intelligence.com"

  build:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: fetch
    if: ${{ needs.fetch.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the data commit from the fetch job
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gta-intelligence
