name: Fetch Data (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch all data sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── GTA V ──────────────────────────────────────────────────────────────

      - name: Fetch vehicle performance data
        run: python scrapers/fetch_vehicles.py
        env:
          BROUGHY_SHEET_ID: ${{ secrets.BROUGHY_SHEET_ID }}

      - name: Fetch Steam player data
        run: python scrapers/fetch_steam.py

      - name: Fetch Google Trends data
        run: python scrapers/fetch_trends.py

      # ── GTA VI ─────────────────────────────────────────────────────────────

      - name: Fetch GTA VI trailer data
        run: python scrapers/gtavi/fetch_trailers.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch GTA VI search trends
        run: python scrapers/gtavi/fetch_search_trends.py

      - name: Fetch trailer view velocity
        run: python scrapers/fetch_youtube_velocity.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # ── Franchise ──────────────────────────────────────────────────────────

      - name: Fetch Take-Two stock price history
        run: python scrapers/fetch_ttwo_stock.py

      - name: Fetch franchise sales data
        run: python scrapers/fetch_franchise_sales.py

      # ── Community & News ───────────────────────────────────────────────────

      - name: Fetch Reddit community data
        run: python scrapers/fetch_reddit.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Fetch intelligence news feeds
        run: python scrapers/fetch_newswire.py

      # ── GTA VI entities ────────────────────────────────────────────────────

      - name: Fetch Leonida Intel entity index
        run: python scrapers/fetch_leonida.py

      # ── Franchise (supplementary) ──────────────────────────────────────────

      - name: Fetch SEC EDGAR delay timeline
        run: python scrapers/fetch_edgar.py

      - name: Fetch Box Office entertainment comparisons
        run: python scrapers/fetch_boxoffice.py

      # ── Commit ─────────────────────────────────────────────────────────────

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: nightly refresh [skip ci]"
          file_pattern: "data/**/*.json"
          commit_user_name: gta-intelligence-bot
          commit_user_email: bot@gtavi.ai

      - name: Post nightly digest to Discord
        run: python scrapers/post_discord_digest.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
