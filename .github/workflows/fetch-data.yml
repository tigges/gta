name: Fetch Data (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch all data sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── GTA V ──────────────────────────────────────────────────────────────

      - name: Fetch vehicle performance data
        run: python scrapers/fetch_vehicles.py
        continue-on-error: true
        env:
          BROUGHY_SHEET_ID: ${{ secrets.BROUGHY_SHEET_ID }}

      - name: Fetch Steam player data
        run: python scrapers/fetch_steam.py

      - name: Fetch Google Trends data
        run: python scrapers/fetch_trends.py

      - name: Fetch GTA V mission payouts (GTA Wiki)
        run: python scrapers/fetch_missions.py

      - name: Fetch GTA Online item price catalogue (GTA Fandom Wiki store pages)
        continue-on-error: true
        run: python scrapers/fetch_gta_prices.py

      - name: Compute GTA-PPI purchasing power index
        run: python scrapers/fetch_gta_ppi.py

      - name: Fetch GTA Online weekly bonus events + sales (Rockstar Newswire)
        run: python scrapers/fetch_weekly_bonuses.py

      - name: Fetch GTABase business and heist data
        continue-on-error: true
        run: python scrapers/fetch_gtabase.py

      - name: Fetch community validation data (OnlyFarms/GTABase cross-check)
        continue-on-error: true
        run: python scrapers/fetch_onlyfarms.py

      - name: Monitor r/gtaonline for nerf/buff meta signals
        continue-on-error: true
        run: python scrapers/fetch_reddit_meta.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Fetch GTA Online DLC trailer thumbnails (YouTube API)
        continue-on-error: true
        run: python scrapers/fetch_gtaonline_dlc_art.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch GTA V story/character assets (YouTube API + GTA Wiki)
        run: python scrapers/fetch_gta5_assets.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch GTA V mission + heist thumbnails (GTA Wiki)
        run: python scrapers/fetch_gta5_mission_thumbs.py

      - name: Fetch GTA Online income sources (all 26 strands + activities)
        run: python scrapers/fetch_gta_income.py

      - name: Fetch GTA Online contact missions from GTA Wiki (per-mission payouts)
        run: python scrapers/fetch_contact_missions.py

      - name: Fetch Import/Export Vehicle Cargo data (vehicles, sell prices, source types)
        run: python scrapers/fetch_vehicle_cargo.py

      - name: Fetch GTA Online property price registry
        run: python scrapers/fetch_gta_properties.py

      - name: Fetch vehicle upgrade (mod) costs
        run: python scrapers/fetch_vehicle_mods.py

      - name: Fetch Shark Card tiers and endgame cost history
        run: python scrapers/fetch_shark_cards.py

      - name: Append current week bonuses to promotional archive time series
        run: python scrapers/fetch_weekly_bonuses.py

      - name: Derive sale-frequency.json from bonus history
        run: python scrapers/derive_sale_frequency.py

      - name: Fetch Newswire article hero images
        continue-on-error: true
        run: python scrapers/fetch_newswire_images.py

      # ── GTA VI ─────────────────────────────────────────────────────────────

      - name: Fetch GTA VI trailer data
        run: python scrapers/gtavi/fetch_trailers.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch GTA VI search trends
        run: python scrapers/gtavi/fetch_search_trends.py

      - name: Fetch trailer view velocity
        run: python scrapers/fetch_youtube_velocity.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # ── Franchise ──────────────────────────────────────────────────────────

      - name: Fetch Take-Two stock price history
        run: python scrapers/fetch_ttwo_stock.py

      - name: Fetch franchise sales data
        run: python scrapers/fetch_franchise_sales.py

      - name: Fetch IGDB franchise metadata
        continue-on-error: true
        run: python scrapers/fetch_igdb.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Fetch Spotify GTA playlist data
        continue-on-error: true
        run: python scrapers/fetch_spotify.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      # ── Community & News ───────────────────────────────────────────────────

      - name: Fetch Reddit community data
        run: python scrapers/fetch_reddit.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Fetch intelligence news feeds
        run: python scrapers/fetch_newswire.py

      # ── GTA VI entities ────────────────────────────────────────────────────

      - name: Fetch Leonida Intel entity index
        run: python scrapers/fetch_leonida.py

      - name: Fetch GTA VI story missions (Day-1 ready — auto-populates at launch)
        continue-on-error: true
        run: python scrapers/fetch_gta6_missions.py

      - name: Enrich GTA VI entity image URLs (GTA Wiki)
        run: python scrapers/fetch_entity_images.py

      # ── Franchise (supplementary) ──────────────────────────────────────────

      - name: Fetch SEC EDGAR delay timeline
        run: python scrapers/fetch_edgar.py

      - name: Fetch Box Office entertainment comparisons
        run: python scrapers/fetch_boxoffice.py

      # ── Commit ─────────────────────────────────────────────────────────────

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: nightly refresh [skip ci]"
          file_pattern: "data/**/*.json public/assets/gta5/story/*.jpg public/assets/gta5/dlc/*.jpg"
          commit_user_name: gta-intelligence-bot
          commit_user_email: bot@gtavi.ai

      - name: Post nightly digest to Discord
        run: python scrapers/post_discord_digest.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
