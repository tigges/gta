name: Fetch Data (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch all data sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch vehicle performance data
        run: python scrapers/fetch_vehicles.py
        env:
          BROUGHY_SHEET_ID: ${{ secrets.BROUGHY_SHEET_ID }}

      - name: Fetch Steam player data
        run: python scrapers/fetch_steam.py

      - name: Fetch Google Trends data
        run: python scrapers/fetch_trends.py

      - name: Fetch GTA VI trailer data
        run: python scrapers/gtavi/fetch_trailers.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch GTA VI search trends
        run: python scrapers/gtavi/fetch_search_trends.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: nightly refresh [skip ci]"
          file_pattern: "data/**/*.json"
          commit_user_name: gta-intelligence-bot
          commit_user_email: bot@gtavi.ai
