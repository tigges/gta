name: Fetch Data & Rebuild

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch all data sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch vehicle performance data
        run: python scrapers/fetch_vehicles.py
        env:
          BROUGHY_SHEET_ID: ${{ secrets.BROUGHY_SHEET_ID }}

      - name: Fetch Steam player data
        run: python scrapers/fetch_steam.py

      - name: Fetch Google Trends data
        run: python scrapers/fetch_trends.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: nightly refresh [skip ci]"
          file_pattern: "data/**/*.json"
          commit_user_name: "gta-intelligence-bot"
          commit_user_email: "bot@gta-intelligence.com"

  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    needs: fetch

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
