name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy leaderboard Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # wrangler v4 requires Node ≥ 22

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Smoke test /health
        run: |
          sleep 8
          HEALTH=$(curl -sf "https://gtavi-leaderboard.workers.dev/health" 2>/dev/null || echo "{}")
          echo "Health response: $HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('✅ Worker healthy' if d.get('ok') else '⚠️  Unexpected response: ' + str(d))
          " 2>/dev/null || echo "⚠️  Could not parse health response"
        continue-on-error: true
