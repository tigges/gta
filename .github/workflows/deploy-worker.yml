name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy leaderboard Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Resolve KV namespace ID
        id: kv
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # List existing KV namespaces and find (or create) gtavi-leaderboard
          EXISTING=$(wrangler kv namespace list --json 2>/dev/null \
            | python3 -c "
          import sys, json
          ns = json.load(sys.stdin)
          match = [n for n in ns if n.get('title') == 'gtavi-leaderboard']
          print(match[0]['id'] if match else '')
          " 2>/dev/null || echo "")

          if [ -z "$EXISTING" ]; then
            echo "Creating KV namespace gtavi-leaderboard..."
            EXISTING=$(wrangler kv namespace create "gtavi-leaderboard" --json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" \
              2>/dev/null || echo "")
          fi

          if [ -z "$EXISTING" ]; then
            echo "❌ Failed to resolve KV namespace ID"
            exit 1
          fi

          echo "KV namespace ID: $EXISTING"
          echo "kv_id=$EXISTING" >> $GITHUB_OUTPUT

      - name: Inject KV namespace ID into wrangler.toml
        run: |
          sed -i "s/CF_KV_NAMESPACE_PLACEHOLDER/${{ steps.kv.outputs.kv_id }}/" wrangler.toml
          echo "wrangler.toml after substitution:"
          grep -A2 "kv_namespaces" wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Smoke test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Wait a moment for propagation
          sleep 5
          WORKER_URL="https://gtavi-leaderboard.${CLOUDFLARE_ACCOUNT_ID:0:8}.workers.dev"
          echo "Testing: $WORKER_URL/health"
          curl -sf "$WORKER_URL/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✓ Worker healthy:', d)"
        continue-on-error: true
