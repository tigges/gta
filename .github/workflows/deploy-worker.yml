name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy leaderboard Worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@latest

      # ── Resolve KV namespace via Cloudflare REST API ───────────────────────
      # wrangler v4 removed --json from kv namespace commands, so we use curl.
      - name: Resolve KV namespace ID
        id: kv
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF_API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"

          # List existing namespaces (no -f so we see the full response on error)
          echo "Calling CF API: $CF_API"
          LIST=$(curl -s -X GET "$CF_API" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")

          echo "List response (first 300 chars): ${LIST:0:300}"

          EXISTING=$(echo "$LIST" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              ns = [n for n in data.get('result',[]) if n.get('title') == 'gtavi-leaderboard']
              print(ns[0]['id'] if ns else '')
          except Exception as e:
              print('')
          " 2>/dev/null || echo "")

          if [ -z "$EXISTING" ]; then
            echo "Namespace not found — creating gtavi-leaderboard..."
            CREATE=$(curl -s -X POST "$CF_API" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"title":"gtavi-leaderboard"}')

            echo "Create response (first 300 chars): ${CREATE:0:300}"

            EXISTING=$(echo "$CREATE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(data.get('result',{}).get('id',''))
          except Exception as e:
              print('')
          " 2>/dev/null || echo "")
          fi

          if [ -z "$EXISTING" ]; then
            echo "❌ Failed to resolve KV namespace ID via REST API (auth error likely)"
            echo "Hint: Ensure CLOUDFLARE_API_TOKEN has 'Workers KV Storage: Edit' permission"
            echo "Trying wrangler kv namespace create as fallback..."
            EXISTING=$(npx wrangler kv namespace create "gtavi-leaderboard" 2>&1 \
              | grep -oP '(?<="id":")[^"]+' | head -1 || echo "")
            if [ -z "$EXISTING" ]; then
              echo "❌ Both REST API and wrangler failed — check token permissions"
              exit 1
            fi
            echo "✅ Created via wrangler: $EXISTING"
          fi

          echo "✅ KV namespace ID: $EXISTING"
          echo "kv_id=$EXISTING" >> $GITHUB_OUTPUT

      # ── Inject KV ID into wrangler.toml ───────────────────────────────────
      - name: Inject KV namespace ID
        run: |
          sed -i "s/CF_KV_NAMESPACE_PLACEHOLDER/${{ steps.kv.outputs.kv_id }}/" wrangler.toml
          echo "wrangler.toml after substitution:"
          cat wrangler.toml

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --no-bundle 2>&1 || wrangler deploy 2>&1

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Smoke test /health
        run: |
          sleep 8
          # Worker URL format: https://{name}.{subdomain}.workers.dev
          # Try the standard workers.dev subdomain
          HEALTH=$(curl -sf "https://gtavi-leaderboard.workers.dev/health" 2>/dev/null || echo "{}")
          echo "Health response: $HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if d.get('ok'):
              print('✅ Worker is healthy')
          else:
              print('⚠️  Health check incomplete (may need a moment to propagate)')
          " 2>/dev/null || echo "⚠️  Could not parse health response"
        continue-on-error: true
