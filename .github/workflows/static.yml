name: Build & Deploy (GitHub Pages)

# The site is served by GitHub Pages. Every push to main builds and deploys.
# While gtavi.ai is parked the site lives at the project URL
# https://tigges.github.io/<repo-name>/. The "Rehost under the Pages base path"
# step reads that path from configure-pages and rewrites the root-relative build
# output to match, so renaming the repo just needs a redeploy. Once a custom
# domain is set again the base path is empty and the step is a no-op.
# The nightly data commit uses [skip ci], which suppresses push triggers, so
# the workflow_run trigger redeploys once the nightly fetch has finished.

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Fetch Data (nightly)"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build

      - name: Rehost under the Pages base path
        run: node scripts/rebase-dist.mjs dist
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          # Parked domain: any page served on gtavi.ai renders blank.
          PAGES_HIDE_HOSTS: gtavi.ai
          # Temporary: browser-tab title shows the repo name instead of "GTA VI.AI".
          PAGES_TITLE: ${{ github.event.repository.name }}

      - name: Check inline scripts are valid JavaScript
        run: npm run check:scripts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
