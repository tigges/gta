name: Build Check

# Runs on every push to main and staging.
# Cloudflare Pages handles the actual deployment automatically
# when it detects a push to the connected repo — no deploy step needed here.

on:
  push:
    branches: ["main", "staging"]
  workflow_dispatch:

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx astro check

      - run: npm run build
