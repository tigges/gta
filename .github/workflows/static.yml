name: Build & Deploy (GitHub Pages)

# The site is served by GitHub Pages. Every push to main builds and deploys.
# It is temporarily published at https://tigges.github.io/gta/ while gtavi.ai is
# parked: the "Rehost under /gta" step rewrites the root-relative build output.
# To move back to gtavi.ai, delete that step (and see AGENTS.md → Deployment).
# The nightly data commit uses [skip ci], which suppresses push triggers, so
# the workflow_run trigger redeploys once the nightly fetch has finished.

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Fetch Data (nightly)"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Rehost under /gta
        run: node scripts/rebase-dist.mjs dist
        env:
          PAGES_BASE: /gta
          PAGES_ORIGIN: https://tigges.github.io
          # Parked domain: any page served on gtavi.ai renders blank.
          PAGES_HIDE_HOSTS: gtavi.ai

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
