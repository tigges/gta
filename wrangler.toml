# GTAVI.AI Community Leaderboard Worker — deploy triggered 2026-05-17
name = "gtavi"
main            = "workers/leaderboard.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace binding — ID is injected by CI (deploy-worker.yml creates it if absent)
[[kv_namespaces]]
binding = "LEADERBOARD"
id      = "867caad43fa4411ab389cd684eb6485e"

[vars]
ALLOWED_ORIGIN = "https://gtavi.ai"

# Weekly snapshot: every Monday at 00:05 UTC
[triggers]
crons = ["5 0 * * 1"]

# Custom domain route (configure in Cloudflare dashboard after first deploy)
# [[routes]]
# pattern = "api.gtavi.ai/leaderboard"
# zone_name = "gtavi.ai"
