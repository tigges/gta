<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <!-- "GTA" small gray label top -->
  <text x="16" y="11" font-family="monospace" font-size="7" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="0.5">GTA</text>
  <!-- "VI" large gold — the distinctive mark -->
  <text x="16" y="26" font-family="monospace" font-size="17" font-weight="700" fill="#f59e0b" text-anchor="middle">VI</text>
</svg>
